[project]
name = "training-my-moe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.29.0",
    "jupyter>=1.1.1",
    "manim>=0.21.0",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
notebooks = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "plotly>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qwenmoe", "configs"]
